related_posts: 3
title: ImpresaConsigliata
baseurl: "/impresaconsigliata"
url: "https://cialdecompatibili-netizen.github.io"
email: ""
description: "ImpresaConsigliata: elenco di imprese consigliate con recensioni verificate e richieste di preventivo gratuite. Per le imprese: schede in evidenza e pacchetti di richieste."
footer_text: "&copy; 2026 ImpresaConsigliata"
minimal_mistakes_skin: default
search: true

# SEO globale
author:
  name: "ImpresaConsigliata"
  bio: "Imprese consigliate e preventivi gratuiti. Pre-ordina il tuo piano."
  links:
    - label: "Scrivici"
      icon: "fas fa-fw fa-envelope"
      url: "/impresaconsigliata/contatti/"

markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
exclude:
  - vendor
  - docs

permalink: /:categories/:title/

timezone:

collections:
  negozio:
    output: true
    permalink: /negozio/:name/
  products:
    output: true
    permalink: /shop/:name/
  servizi:
    output: true
    permalink: /servizi/:name/
  progetti:
    output: true
    permalink: /progetti/:name/

include:
  - _pages

plugins:
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

footer:
  links: []

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: products
    values:
      layout: product
      classes: wide
  - scope:
      path: ""
      type: servizi
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
  - scope:
      path: ""
      type: progetti
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

cms_homepage:

# E-commerce (porting da ecommercealfolio1). Interruttore: admin > Impostazioni > Abilita e-commerce. Solo true accende, chiave assente = spento.
# Spento = spariscono menu, carrello e script; pagine /negozio/ /carrello/ /ordine/ e schede mostrano 'non disponibile'. Prodotti e categorie restano salvati.
ecommerce: true
# Ordini (SMOKE TEST, nessun pagamento): il browser scrive una riga nel foglio Google chiamando questo Apps Script. Vuoto = il pulsante 'Invia richiesta d'ordine' resta spento.
ordini:
  tracker: ""
